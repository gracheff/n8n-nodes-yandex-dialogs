# Публикация пакета в npm при выпуске GitHub Release через Trusted Publishing (OIDC).
# Требуется настройка на npmjs.com: пакет → Settings → Trusted Publisher:
#   owner: gracheff, repo: n8n-nodes-yandex-dialogs, workflow: publish.yml
# Токен NPM_TOKEN не используется — аутентификация по OIDC.
# Запуск: создайте Release с тегом вида v1.0.4 (тег должен совпадать с version в package.json).
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  # Обязательно для OIDC-токена (trusted publishing + provenance)
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      # Trusted publishing поддерживается только npm >= 11.5.1,
      # а setup-node c node 22 ставит npm 10.x — обновляем npm.
      - name: Обновление npm до версии с поддержкой trusted publishing
        run: npm install -g npm@^11

      - name: Проверка соответствия тега версии пакета
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Тег $GITHUB_REF_NAME не совпадает с version в package.json ($PKG_VERSION)"
            exit 1
          fi

      - name: Установка зависимостей
        run: npm ci

      - name: Тесты
        run: npm test

      - name: Линт
        run: npm run lint

      - name: Сборка
        run: npm run build

      # --provenance включает OIDC: без NODE_AUTH_TOKEN npm проходит
      # аутентификацию как trusted publisher из конфигурации на npmjs.com
      - name: Публикация
        run: npm publish --provenance
