# Временный workflow для отладки trusted publishing: показывает claims OIDC-токена.
# После диагностики удалить.
name: OIDC debug

on:
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Получить и декодировать OIDC-токен
        run: |
          curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm_registry" > /tmp/oidc.json
          cat /tmp/oidc.json | node -e "
            let d=''; process.stdin.on('data',c=>d+=c).on('end',()=>{
              const token = JSON.parse(d).value;
              const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
              console.log('=== Claims OIDC-токена (audience npm_registry) ===');
              for (const k of ['iss','aud','repository_owner','repository','ref','workflow','workflow_ref','environment','job_workflow_ref','repository_owner_id','repository_id','run_id','sub']) {
                console.log(k + ': ' + JSON.stringify(payload[k]));
              }
            });
          "
